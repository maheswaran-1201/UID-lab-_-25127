<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amrita Campus Login</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background-color:#a9445b;
}

.header{
    background:#7a1f33;
    color:white;
    padding:25px;
    text-align:center;
}

.campus-section{
    padding:40px;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:25px;
}

.card{
    border-radius:10px;
    overflow:hidden;
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card a{
    text-decoration:none;
    color:white;
}

.overlay{
    position:relative;
    margin-top:-40px;
    padding:10px;
    text-align:center;
    font-weight:bold;
}

iframe{
    width:80%;
    height:300px;
    border:none;
    border-radius:10px;
    background:white;
    margin:40px auto;
    display:block;
}
</style>
</head>

<body>

<div class="header">
    <h1>Amrita Vishwa Vidyapeetham</h1>
    <p>Campus Login Portal</p>
</div>

<div class="campus-section">

    <div class="card">
        <a href="coimbatore-login.html" target="loginFrame">
            <img src="coimbatore.png" alt="Coimbatore">
            <div class="overlay">Coimbatore</div>
        </a>
    </div>

    <div class="card">
        <a href="bangalore-login.html" target="loginFrame">
            <img src="bangalore.png" alt="Bangalore">
            <div class="overlay">Bangalore</div>
        </a>
    </div>

    <div class="card">
        <a href="amritapuri-login.html" target="loginFrame">
            <img src="amritapuri.png" alt="Amritapuri">
            <div class="overlay">Amritapuri</div>
        </a>
    </div>

    <div class="card">
        <a href="chennai-login.html" target="loginFrame">
            <img src="chennai.png" alt="Chennai">
            <div class="overlay">Chennai</div>
        </a>
    </div>

    <div class="card">
        <a href="amaravati-login.html" target="loginFrame">
            <img src="amaravavati.png" alt="Amaravati">
            <div class="overlay">Amaravati</div>
        </a>
    </div>

    <div class="card">
        <a href="kochi-login.html" target="loginFrame">
            <img src="kochi.png" alt="Kochi">
            <div class="overlay">Kochi</div>
        </a>
    </div>

</div>

<iframe name="loginFrame" title="Campus Login Form"></iframe>

</body>
</html>
