<!DOCTYPE html>
<html lang="en">
<head>

    <title>Semester 2 Syllabus</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color:beige;
        }

        h1 {
            text-align: center;
            margin: 20px;
            color: maroon;
        }

        .syllabus-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 90%;
            margin: 0 auto;
        }

        .subject-card {
            background-color: white;
            border: 2px solid maroon;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .subject-card img {
            width: 100%;
            height: auto;
            border-bottom: 1px solid maroon;
        }

        .subject-name {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
            color: navy;
        }

        body {
            background-image: url('mountain.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<p class="student-info">Name: MAHESWARAN Roll no: AV.SC.U4CSE25127 Sec: CSE-B</p>
<body>
    <div class="container">
        <h1>Semester 2 Syllabus</h1>
        
        <div class="syllabus-grid">
            <!-- First Row -->
            <div class="subject-card">
                <img src="dm.png" alt="Subject 1 Syllabus">
                <div class="subject-name">Discrete Mathematics</div>
            </div>

            <div class="subject-card">
                <img src="linear algebra.png" alt="Subject 2 Syllabus">
                <div class="subject-name">Linear Algebra</div>
            </div>

            <!-- Second Row -->
            <div class="subject-card">
                <img src="modern physics.png" alt="Subject 3 Syllabus">
                <div class="subject-name">Modern Physics</div>
            </div>

            <div class="subject-card">
                <img src="mp.png" alt="Subject 4 Syllabus">

            </div>

            <!-- Third Row -->
            <div class="subject-card">
                <img src="oops.png" alt="Subject 5 Syllabus">
                <div class="subject-name">Object Oriented Programming</div>
            </div>

            <div class="subject-card">
                <img src="uid.png" alt="Subject 6 Syllabus">
                <div class="subject-name">User Interface Design</div>
            </div>
        </div>
    </div>
</body>
</html>
