<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>styles example</title>
<style>
.highlight {
background-color: rgba(234, 14, 18, 0.944);
font-weight: bold;
}
.italic {
font-style: italic;
}
</style>
</head>
<body>
<p class="highlight">This paragraph is highlighted with a red background and bold text.</p>
<p class="italic">This paragraph is styled in italics.</p>
</body>
</html>
