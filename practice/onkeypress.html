<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnKeyPress Practice</title>
</head>
<body>
    <p>use the html dom to assign an "onkeypress" event to this paragraph.</p>
    <p>Press any key.</p>
    <input type="text" id="demo" placeholder="Enter text here">
    <script>
        document.getElementById("demo").onkeypress = function() {myFunction()};
        function myFunction() {
            alert("You pressed a key inside the input field.");
        }
    </script>

</body>
</html>
