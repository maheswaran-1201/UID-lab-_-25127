<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript functions</title>

<script>
    function add(a, b) {        
        document.write(a + b);
    }
    let a = parseInt(prompt("Enter first number:"));
    let b = parseInt(prompt("Enter second number:"));   
    add(a, b);
</script>
</html>
